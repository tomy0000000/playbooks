services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:v1.104
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
    env_file: tailscale.env
    restart: always
    volumes:
      - state:/var/lib/tailscale

networks:
  default:
    external: true
    name: tailscale

volumes:
  state:
